# =============================================================================
# 快速部署：多阶段从 Docker Hub 拉 web 镜像 → 构建产物 → nginx 托管
#
# 无需源码，所有工作容器内完成。约 2 分钟首次启动，后续秒级。
#
# 运行：
#   cd deploy && docker compose up -d
#   打开 http://localhost:8080
#
# 注意：需在包含 pubspec.yaml 的 Flutter 项目目录下运行，
# 否则 web build 阶段找不到源码会失败。
# =============================================================================
services:
  web:
    build:
      context: ..
      dockerfile: ../Dockerfile.deploy
    ports:
      - "8080:80"
    restart: unless-stopped