name: "07. Docker 加速 — OHOS 打包"

# =============================================================================
# 示范：用预构建的 GHCR builder 镜像打包鸿蒙（HarmonyOS）
#
# 与 01. OHOS 打包 的区别只在于"构建环境从哪来"：
#   01 —— uses: zhongdaiqi/flutter-ohos-builder@v1.4
#          Docker Action 每次 CI 现场重建 ~8 GB 镜像，实测 7.3~8.8 分钟
#   07 —— docker pull 预构建镜像 + docker run
#          镜像已含 OHOS SDK / Flutter / JDK，直接拉下来就构建
#
# 镜像 ghcr.io/zhongdaiqi/flutter-ohos-builder:latest 是公共的，无需登录。
#
# 可选：配置 OHOS 签名 secret 后自动升级为 release .app（否则 debug .hap）
#   OHOS_SIGN_KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD / CERT_BASE64
#   PROFILE_BASE64 / STORE_FILE_BASE64 (.p12) / MATERIAL_BASE64 (material/ zip)
# =============================================================================

on:
  workflow_dispatch:

env:
  # Pinned to a release tag, not :latest. A floating tag means the next push to the
  # builder repo silently changes what executes here - and this container is handed
  # the OHOS signing passwords on its command line. Bump deliberately.
  #
  # NOTE: the container runs as root, so whatever it writes into the mounted workspace
  # (ohos/, build/, flutter-ohos-build.log) comes out owned by root. Harmless in CI;
  # if you run this locally, `sudo chown -R "$USER" .` afterwards.
  BUILDER_IMAGE: ghcr.io/zhongdaiqi/flutter-ohos-builder:v1.4

# Least privilege: this workflow only reads the repo and uploads artifacts.
# Without an explicit block it inherits the repository default, which is often
# read/write for everything - a much bigger blast radius than it needs.
permissions:
  contents: read

jobs:
  build-ohos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No "Free disk space" step here on purpose: this workflow only PULLS and runs a
      # prebuilt image, it never builds one - so the `sudo docker image prune -af` of
      # that step burns ~60s and wipes the runner's image cache for no benefit.
      # (01 keeps it: `uses:` really does build the ~8 GB image on the runner.)

      - name: Pull prebuilt builder image
        run: |
          df -h /
          echo "pulling ${BUILDER_IMAGE} ..."
          time docker pull "${BUILDER_IMAGE}"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' \
            | grep flutter-ohos-builder || true

      - name: Build HarmonyOS
        env:
          SIGN_ENABLED: ${{ (secrets.OHOS_SIGN_STORE_FILE_BASE64 != '') && 'true' || 'false' }}
          OHOS_SIGN_ALG: ${{ secrets.OHOS_SIGN_ALG || 'SHA256withECDSA' }}
          OHOS_SIGN_KEY_ALIAS: ${{ secrets.OHOS_SIGN_KEY_ALIAS }}
          OHOS_SIGN_KEY_PASSWORD: ${{ secrets.OHOS_SIGN_KEY_PASSWORD }}
          OHOS_SIGN_STORE_PASSWORD: ${{ secrets.OHOS_SIGN_STORE_PASSWORD }}
          OHOS_SIGN_CERT_BASE64: ${{ secrets.OHOS_SIGN_CERT_BASE64 }}
          OHOS_SIGN_PROFILE_BASE64: ${{ secrets.OHOS_SIGN_PROFILE_BASE64 }}
          OHOS_SIGN_STORE_FILE_BASE64: ${{ secrets.OHOS_SIGN_STORE_FILE_BASE64 }}
          OHOS_SIGN_MATERIAL_BASE64: ${{ secrets.OHOS_SIGN_MATERIAL_BASE64 }}
        run: |
          START=$(date +%s)

          if [[ "${SIGN_ENABLED}" == "true" ]]; then
            TARGET=app; MODE=release
          else
            TARGET=hap; MODE=debug
          fi
          echo "build-target=${TARGET} build-mode=${MODE}"

          ARGS=(
            --flutter-version 3.41.10-ohos-1.0.1
            --ohos-api 26
            --bundle-name com.zhongdaiqi.app
            --app-name flutter-ohos-app-template
            --build-target "${TARGET}"
            --build-mode "${MODE}"
            --ohos-sign-enabled "${SIGN_ENABLED}"
          )
          if [[ "${SIGN_ENABLED}" == "true" ]]; then
            ARGS+=(
              --ohos-sign-alg "${OHOS_SIGN_ALG}"
              --ohos-sign-key-alias "${OHOS_SIGN_KEY_ALIAS}"
              --ohos-sign-key-password "${OHOS_SIGN_KEY_PASSWORD}"
              --ohos-sign-store-password "${OHOS_SIGN_STORE_PASSWORD}"
              --ohos-sign-cert-base64 "${OHOS_SIGN_CERT_BASE64}"
              --ohos-sign-profile-base64 "${OHOS_SIGN_PROFILE_BASE64}"
              --ohos-sign-store-file-base64 "${OHOS_SIGN_STORE_FILE_BASE64}"
              --ohos-sign-material-base64 "${OHOS_SIGN_MATERIAL_BASE64}"
            )
          fi

          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${BUILDER_IMAGE}" "${ARGS[@]}"

          echo "build wall time: $(( $(date +%s) - START ))s"

      - name: Show build log
        if: always()
        run: cat flutter-ohos-build.log 2>/dev/null || echo '(no build log)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-ohos-package
          path: |
            ohos/entry/build/default/outputs/default/*.hap
            ohos/build/outputs/default/*.app
            flutter-ohos-build.log
          if-no-files-found: warn
          retention-days: 7
