name: "03. OHOS + Android 同时打包"

# =============================================================================
# 示范：使用 flutter-ohos-builder 同时打包鸿蒙与 Android
#
# 两个构建 job 并行执行，互不干扰：
#   - build-ohos    → 产出 .hap 或 .app
#   - build-android → 产出 .apk
#
# 需在仓库 Settings → Secrets and variables → Actions 中配置：
#   OHOS 签名（见 01-ohos-build.yml 注释）
#   Android 签名（见 02-android-build.yml 注释）
# =============================================================================

on:
  workflow_dispatch:

jobs:
  # ── 鸿蒙 ──
  build-ohos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build HarmonyOS
        uses: zhongdaiqi/flutter-ohos-builder@main
        with:
          flutter-version: '3.41.10-ohos-1.0.1'
          ohos-api: '26'
          bundle-name: 'com.zhongdaiqi.app'
          app-name: 'flutter-ohos-app-template'

          build-target: ${{ (secrets.OHOS_SIGN_STORE_FILE_BASE64 != '') && 'app' || 'hap' }}
          build-mode: ${{ (secrets.OHOS_SIGN_STORE_FILE_BASE64 != '') && 'release' || 'debug' }}

          ohos-sign-enabled: ${{ (secrets.OHOS_SIGN_STORE_FILE_BASE64 != '') && 'true' || 'false' }}
          ohos-sign-alg: ${{ secrets.OHOS_SIGN_ALG || 'SHA256withECDSA' }}
          ohos-sign-key-alias: ${{ secrets.OHOS_SIGN_KEY_ALIAS }}
          ohos-sign-key-password: ${{ secrets.OHOS_SIGN_KEY_PASSWORD }}
          ohos-sign-store-password: ${{ secrets.OHOS_SIGN_STORE_PASSWORD }}
          ohos-sign-cert-base64: ${{ secrets.OHOS_SIGN_CERT_BASE64 }}
          ohos-sign-profile-base64: ${{ secrets.OHOS_SIGN_PROFILE_BASE64 }}
          ohos-sign-store-file-base64: ${{ secrets.OHOS_SIGN_STORE_FILE_BASE64 }}
          ohos-sign-material-base64: ${{ secrets.OHOS_SIGN_MATERIAL_BASE64 }}

      - name: Show build log
        if: always()
        run: cat flutter-ohos-build.log 2>/dev/null || echo '(no build log)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohos-package
          path: |
            ohos/entry/build/default/outputs/default/*.hap
            ohos/build/outputs/default/*.app
            flutter-ohos-build.log
          if-no-files-found: warn
          retention-days: 7

  # ── Android ──
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build Android
        uses: zhongdaiqi/flutter-ohos-builder@main
        with:
          flutter-version: '3.41.10-ohos-1.0.1'
          ohos-api: '26'
          bundle-name: 'com.zhongdaiqi.app'
          app-name: 'flutter-ohos-app-template'

          build-target: 'android'
          build-mode: ${{ (secrets.ANDROID_STORE_BASE64 != '') && 'release' || 'debug' }}

          android-sign-enabled: ${{ (secrets.ANDROID_STORE_BASE64 != '') && 'true' || 'false' }}
          android-sign-key-alias: ${{ secrets.ANDROID_SIGN_KEY_ALIAS }}
          android-sign-key-password: ${{ secrets.ANDROID_SIGN_KEY_PASSWORD }}
          android-sign-store-base64: ${{ secrets.ANDROID_STORE_BASE64 }}
          android-sign-store-password: ${{ secrets.ANDROID_SIGN_STORE_PASSWORD }}

      - name: Show build log
        if: always()
        run: cat flutter-ohos-build.log 2>/dev/null || echo '(no build log)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-package
          path: |
            build/app/outputs/flutter-apk/**/*.apk
            flutter-ohos-build.log
          if-no-files-found: warn
          retention-days: 7