name: "08. Docker 加速 — Android 打包"

# =============================================================================
# 示范：用预构建的 GHCR builder 镜像打包 Android APK
#
# 与 02. Android 打包 的区别只在于"构建环境从哪来"：
#   02 —— uses: zhongdaiqi/flutter-ohos-builder@main（每次现场重建 ~8 GB 镜像）
#   08 —— docker pull 预构建镜像 + docker run
#          镜像已含 Android SDK / JDK / Flutter，直接拉下来就构建
#
# 镜像 ghcr.io/zhongdaiqi/flutter-ohos-builder:latest 是公共的，无需登录。
#
# 可选：配置 Android 签名 secret 后自动升级为已正式签名的 release APK
#   ANDROID_STORE_BASE64 (.jks) / ANDROID_SIGN_KEY_ALIAS
#   ANDROID_SIGN_KEY_PASSWORD / ANDROID_SIGN_STORE_PASSWORD
# =============================================================================

on:
  workflow_dispatch:

env:
  BUILDER_IMAGE: ghcr.io/zhongdaiqi/flutter-ohos-builder:latest

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Pull prebuilt builder image
        run: |
          echo "pulling ${BUILDER_IMAGE} ..."
          time docker pull "${BUILDER_IMAGE}"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' \
            | grep flutter-ohos-builder || true

      - name: Build Android
        env:
          SIGN_ENABLED: ${{ (secrets.ANDROID_STORE_BASE64 != '') && 'true' || 'false' }}
          ANDROID_SIGN_KEY_ALIAS: ${{ secrets.ANDROID_SIGN_KEY_ALIAS }}
          ANDROID_SIGN_KEY_PASSWORD: ${{ secrets.ANDROID_SIGN_KEY_PASSWORD }}
          ANDROID_SIGN_STORE_BASE64: ${{ secrets.ANDROID_STORE_BASE64 }}
          ANDROID_SIGN_STORE_PASSWORD: ${{ secrets.ANDROID_SIGN_STORE_PASSWORD }}
        run: |
          START=$(date +%s)

          if [[ "${SIGN_ENABLED}" == "true" ]]; then
            MODE=release
          else
            MODE=debug
          fi
          echo "build-target=android build-mode=${MODE}"

          ARGS=(
            --flutter-version 3.41.10-ohos-1.0.1
            --ohos-api 26
            --bundle-name com.zhongdaiqi.app
            --app-name flutter-ohos-app-template
            --build-target android
            --build-mode "${MODE}"
            --android-sign-enabled "${SIGN_ENABLED}"
          )
          if [[ "${SIGN_ENABLED}" == "true" ]]; then
            ARGS+=(
              --android-sign-key-alias "${ANDROID_SIGN_KEY_ALIAS}"
              --android-sign-key-password "${ANDROID_SIGN_KEY_PASSWORD}"
              --android-sign-store-base64 "${ANDROID_SIGN_STORE_BASE64}"
              --android-sign-store-password "${ANDROID_SIGN_STORE_PASSWORD}"
            )
          fi

          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${BUILDER_IMAGE}" "${ARGS[@]}"

          echo "build wall time: $(( $(date +%s) - START ))s"

      - name: Show build log
        if: always()
        run: cat flutter-ohos-build.log 2>/dev/null || echo '(no build log)'

      - name: Verify APK signature
        if: success()
        run: |
          LOG=flutter-ohos-build.log
          if grep -q "apksigner verify: OK" "$LOG" 2>/dev/null \
             && ! grep -q "Android Debug" "$LOG" 2>/dev/null; then
            echo "PASS: APK signed with the configured keystore"
            grep "Signer #" "$LOG" || true
          elif grep -q "Android Debug" "$LOG" 2>/dev/null; then
            echo "INFO: signed with Android Debug (no real keystore configured)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-android-package
          path: |
            build/app/outputs/flutter-apk/**/*.apk
            flutter-ohos-build.log
          if-no-files-found: warn
          retention-days: 7
