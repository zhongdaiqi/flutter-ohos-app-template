name: "04. Web 打包"

# =============================================================================
# 示范：使用预构建的 Flutter Web Docker 镜像单独打包 Web
#
# 产出 build/web/ 目录，可直接部署到任意静态托管（GitHub Pages、
# Cloudflare Pages、Vercel、Nginx 等）。
#
# 无需配置任何 secret。
# 前提：需先运行 "05. Web Docker 镜像构建与推送" 构建并推送镜像。
# =============================================================================

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull prebuilt web image
        run: docker pull ${{ secrets.WEB_DOCKER_REPOSITORY || 'zhongdaiqi/flutter-ohos-app-template' }}:web-latest

      - name: Build Web
        run: |
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            ${{ secrets.WEB_DOCKER_REPOSITORY || 'zhongdaiqi/flutter-ohos-app-template' }}:web-latest \
            --flutter-version 3.41.10-ohos-1.0.1 \
            --ohos-api 26 \
            --build-target web \
            --build-mode release \
            --bundle-name com.zhongdaiqi.app \
            --app-name flutter-ohos-app-template

      - name: Show build log
        if: always()
        run: cat flutter-ohos-build.log 2>/dev/null || echo '(no build log)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-package
          path: |
            build/web/**
            flutter-ohos-build.log
          if-no-files-found: warn
          retention-days: 7