name: "04. Web 打包"

# =============================================================================
# 示范：使用预构建的 Web Builder 镜像在 CI 中打包 Flutter Web
#
# 产出 build/web/ 目录，可直接部署到任意静态托管。
#
# 无需配置任何 secret（Web Builder 镜像是公共的）。
# =============================================================================

on:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo and uploads artifacts.
# Without an explicit block it inherits the repository default, which is often
# read/write for everything - a much bigger blast radius than it needs.
permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Web
        run: |
          # 07/08/09 pin their builder image to a release tag because that image runs the
          # signing code. This one does not: the web builder never touches OHOS or Android
          # signing, so a floating :web-latest is fine here and saves bumping a version on
          # every builder release. Use :web-<sha> instead if you want reproducibility.
          # NOTE: no "Free disk space" step - this only pulls the ~500 MB web image.
          df -h /
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            zhongdaiqi/flutter-ohos-builder:web-latest \
            --flutter-version 3.41.10-ohos-1.0.1 \
            --ohos-api 26 \
            --build-target web \
            --build-mode release \
            --bundle-name com.zhongdaiqi.app \
            --app-name flutter-ohos-app-template

      - name: Show build log
        if: always()
        run: cat flutter-ohos-build.log 2>/dev/null || echo '(no build log)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-package
          path: |
            build/web/**
            flutter-ohos-build.log
          if-no-files-found: warn
          retention-days: 7