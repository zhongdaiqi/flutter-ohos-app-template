name: "06. Web 应用镜像构建与推送"

# =============================================================================
# 多阶段构建 + 推送即开即用的 Flutter Web 应用镜像到 Docker Hub。
#
# Stage 1: zhongdaiqi/flutter-ohos-builder:web-latest 构建源码
# Stage 2: nginx:alpine 托管 build/web/
#
# 最终镜像（~10 MB）只有 nginx + HTML/CSS/JS 静态文件。
# 不含 Flutter SDK、entrypoint.sh、签名代码、密钥。
#
# 即开即用：
#   docker run -p 8080:80 zhongdaiqi/flutter-ohos-app-template:web-latest
#
# 产物：
#   ${{ secrets.WEB_DOCKER_REPOSITORY }}:web-latest
#   ${{ secrets.WEB_DOCKER_REPOSITORY }}:web-<sha>
#
# 需配置 secret：
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN
#   - WEB_DOCKER_REPOSITORY    （默认 zhongdaiqi/flutter-ohos-app-template）
# =============================================================================

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: |
            ${{ secrets.WEB_DOCKER_REPOSITORY || 'zhongdaiqi/flutter-ohos-app-template' }}:web-latest
            ${{ secrets.WEB_DOCKER_REPOSITORY || 'zhongdaiqi/flutter-ohos-app-template' }}:web-${{ github.sha }}