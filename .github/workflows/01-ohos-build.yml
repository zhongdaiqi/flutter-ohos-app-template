name: "01. OHOS 打包"

# =============================================================================
# 示范：使用 flutter-ohos-builder 单独打包鸿蒙（HarmonyOS）
#
# - 如果配置了 OHOS 签名 secret → 打 release .app（已正式签名）
# - 如果没有配置签名 secret → 打 debug .hap（测试用）
#
# 需在仓库 Settings → Secrets and variables → Actions 中配置：
#   - OHOS_SIGN_KEY_ALIAS
#   - OHOS_SIGN_KEY_PASSWORD
#   - OHOS_SIGN_STORE_PASSWORD
#   - OHOS_SIGN_CERT_BASE64
#   - OHOS_SIGN_PROFILE_BASE64
#   - OHOS_SIGN_STORE_FILE_BASE64    （.p12 文件 Base64）
#   - OHOS_SIGN_MATERIAL_BASE64      （DevEco material/ 目录 ZIP + Base64）
# =============================================================================

on:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo and uploads artifacts.
# Without an explicit block it inherits the repository default, which is often
# read/write for everything - a much bigger blast radius than it needs.
permissions:
  contents: read

jobs:
  build-ohos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build HarmonyOS
        uses: zhongdaiqi/flutter-ohos-builder@v1.4
        with:
          flutter-version: '3.41.10-ohos-1.0.1'
          ohos-api: '26'
          bundle-name: 'com.zhongdaiqi.app'
          app-name: 'flutter-ohos-app-template'

          # 有签名 secret → release .app；无 → debug .hap
          build-target: ${{ (secrets.OHOS_SIGN_STORE_FILE_BASE64 != '') && 'app' || 'hap' }}
          build-mode: ${{ (secrets.OHOS_SIGN_STORE_FILE_BASE64 != '') && 'release' || 'debug' }}

          ohos-sign-enabled: ${{ (secrets.OHOS_SIGN_STORE_FILE_BASE64 != '') && 'true' || 'false' }}
          ohos-sign-alg: ${{ secrets.OHOS_SIGN_ALG || 'SHA256withECDSA' }}
          ohos-sign-key-alias: ${{ secrets.OHOS_SIGN_KEY_ALIAS }}
          ohos-sign-key-password: ${{ secrets.OHOS_SIGN_KEY_PASSWORD }}
          ohos-sign-store-password: ${{ secrets.OHOS_SIGN_STORE_PASSWORD }}
          ohos-sign-cert-base64: ${{ secrets.OHOS_SIGN_CERT_BASE64 }}
          ohos-sign-profile-base64: ${{ secrets.OHOS_SIGN_PROFILE_BASE64 }}
          ohos-sign-store-file-base64: ${{ secrets.OHOS_SIGN_STORE_FILE_BASE64 }}
          ohos-sign-material-base64: ${{ secrets.OHOS_SIGN_MATERIAL_BASE64 }}

      - name: Show build log
        if: always()
        run: cat flutter-ohos-build.log 2>/dev/null || echo '(no build log)'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohos-package
          path: |
            ohos/entry/build/default/outputs/default/*.hap
            ohos/build/outputs/default/*.app
            flutter-ohos-build.log
          if-no-files-found: warn
          retention-days: 7